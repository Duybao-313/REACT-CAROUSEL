            }

        // Format helper functions
        const generateCode = (icon, format, color, size) => {
            const hexColor = color === 'currentColor' ? 'currentColor' : color;
            
            switch (format) {
                case 'svg':
                    return `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="${icon.viewBox}" fill="${hexColor}">\n  ${icon.path}\n</svg>`;
                
                case 'jsx':
                    const componentName = icon.name.replace(/[^a-zA-Z0-9]/g, '') + 'Icon';
                    return `export const ${componentName} = ({ size = ${size}, color = "${hexColor}", className = "" }) => (\n  <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="${icon.viewBox}" fill={color} className={className}>\n    ${icon.path}\n  </svg>\n);`;
                
                case 'vue':
                    return `<template>\n  <svg xmlns="http://www.w3.org/2000/svg" :width="size" :height="size" viewBox="${icon.viewBox}" :fill="color">\n    ${icon.path}\n  </svg>\n</template>\n\n<script>\nexport default {\n  name: '${icon.id}-icon',\n  props: {\n    size: { type: Number, default: ${size} },\n    color: { type: String, default: '${hexColor}' }\n  }\n}\n<\/script>`;

                case 'css':
                    const rawSvg = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='${icon.viewBox}' fill='${encodeURIComponent(hexColor)}'>${icon.path}</svg>`;
                    return `.icon-${icon.id} {\n  width: ${size}px;\n  height: ${size}px;\n  background-image: url("data:image/svg+xml,${rawSvg}");\n  background-repeat: no-repeat;\n  background-position: center;\n}`;
                
                default:
                    return '';
            }
        };

        function App() {
            // App state
            const [selectedCategory, setSelectedCategory] = useState('All');
            const [searchQuery, setSearchQuery] = useState('');
            const [iconColor, setIconColor] = useState('#FFFFFF');
            const [iconSize, setIconSize] = useState(24);
            const [codeFormat, setCodeFormat] = useState('svg');
            const [activeModalIcon, setActiveModalIcon] = useState(null);
            const [toastMessage, setToastMessage] = useState(null);

            // Live YouTube Player State
            const [isPlaying, setIsPlaying] = useState(false);
            const [currentTime, setCurrentTime] = useState(84); // 1:24
            const [duration] = useState(255); // 4:15
            const [volume, setVolume] = useState(80);
            const [isMuted, setIsMuted] = useState(false);
            const [subtitlesEnabled, setSubtitlesEnabled] = useState(true);
            const [showSettingsMenu, setShowSettingsMenu] = useState(false);
            const [playbackRate, setPlaybackRate] = useState('1.0x');
            const [videoQuality, setVideoQuality] = useState('1080p60');
            const [isTheater, setIsTheater] = useState(false);
            const [isFullscreen, setIsFullscreen] = useState(false);
            const [actionFeedback, setActionFeedback] = useState(null);

            const canvasRef = useRef(null);

            // Show Toast Notification
            const triggerToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(null), 3000);
            };

            // Copy to Clipboard logic
            const copyToClipboard = (text, label) => {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                document.body.appendChild(textarea);
                textarea.select();
                try {
                    document.execCommand('copy');
                    triggerToast(`Đã sao chép mã ${label}!`);
                } catch (err) {
                    triggerToast('Lỗi khi sao chép!');
                }
                document.body.removeChild(textarea);
            };

            // Action Feedback overlay on Player
            const triggerActionFeedback = (text) => {
                setActionFeedback(text);
                setTimeout(() => setActionFeedback(null), 700);
            };

            // Player logic: Time update ticker
            useEffect(() => {
                let interval;
                if (isPlaying) {
                    interval = setInterval(() => {
                        setCurrentTime(prev => {
                            if (prev >= duration) {
                                setIsPlaying(false);
                                return 0;
                            }
                            return prev + 1;
                        });
                    }, 1000);
                }
                return () => clearInterval(interval);
            }, [isPlaying, duration]);

            // Draw dynamic animated canvas background for video player
            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                let animationId;
                let step = 0;

                const render = () => {
                    step += 0.02;
                    ctx.fillStyle = '#0a0a12';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);

                    // Draw animated dynamic waves / neon shapes
                    const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
                    gradient.addColorStop(0, '#1e1b4b');
                    gradient.addColorStop(0.5, '#311042');
                    gradient.addColorStop(1, '#000000');
                    ctx.fillStyle = gradient;
                    ctx.fillRect(0, 0, canvas.width, canvas.height);

                    // Moving audio visualizer waves
                    ctx.beginPath();
                    ctx.moveTo(0, canvas.height / 2);
                    for (let i = 0; i < canvas.width; i += 10) {
                        const y = Math.sin(i * 0.01 + step) * (isPlaying ? 25 : 5) + canvas.height / 2;
                        ctx.lineTo(i, y);
                    }
                    ctx.lineTo(canvas.width, canvas.height);
                    ctx.lineTo(0, canvas.height);
                    ctx.fillStyle = isPlaying ? 'rgba(255, 0, 85, 0.25)' : 'rgba(100, 100, 100, 0.1)';
                    ctx.fill();

                    // Ambient glow sphere
                    const centerX = canvas.width / 2 + Math.cos(step * 0.5) * 50;
                    const centerY = canvas.height / 2 + Math.sin(step * 0.5) * 20;
                    const radial = ctx.createRadialGradient(centerX, centerY, 10, centerX, centerY, 180);
                    radial.addColorStop(0, isPlaying ? 'rgba(255, 0, 0, 0.4)' : 'rgba(255, 255, 255, 0.1)');
                    radial.addColorStop(1, 'transparent');
                    ctx.fillStyle = radial;
                    ctx.beginPath();
                    ctx.arc(centerX, centerY, 180, 0, Math.PI * 2);
                    ctx.fill();

                    animationId = requestAnimationFrame(render);
                };

                render();
                return () => cancelAnimationFrame(animationId);
            }, [isPlaying]);

            // Helper to format time strings (e.g. 01:24)
            const formatTime = (seconds) => {
                const mins = Math.floor(seconds / 60);
                const secs = Math.floor(seconds % 60);
                return `${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;
            };

            // Fast forward / Rewind handlers
            const handleRewind = () => {
                setCurrentTime(prev => Math.max(0, prev - 10));
                triggerActionFeedback('-10s');
            };

            const handleFastForward = () => {
                setCurrentTime(prev => Math.min(duration, prev + 10));
                triggerActionFeedback('+10s');
            };

            // Filter icons
            const categories = ['All', 'Playback', 'Audio', 'Display', 'Settings'];
            const filteredIcons = YOUTUBE_ICONS.filter(icon => {
                const matchesCat = selectedCategory === 'All' || icon.category === selectedCategory;
                const matchesQuery = searchQuery === '' || 
                    icon.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
                    icon.tags.some(t => t.toLowerCase().includes(searchQuery.toLowerCase()));
                return matchesCat && matchesQuery;
            });

            return (
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
                    
                    {/* Header */}
                    <header className="flex flex-col md:flex-row md:items-center justify-between border-b border-yt-border pb-6 mb-8 gap-4">
                        <div>
                            <div className="flex items-center gap-3">
                                <div className="p-2.5 bg-red-600 rounded-2xl shadow-lg shadow-red-600/30 text-white flex items-center justify-center">

                                        <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
                                    </svg>
                                </div>
                                <div>
                                    <h1 className="text-2xl sm:text-3xl font-extrabold tracking-tight text-white flex items-center gap-2">
                                        YouTube Controls Icon Generator
                                    </h1>
                                    <p className="text-sm text-gray-400 mt-0.5">
                                        Bộ icon trình phát video YouTube chuẩn vector, tương tác trực tiếp & copy mã SVG / React
                                    </p>
                                </div>
                            </div>
                        </div>
                        <div className="flex items-center gap-2">
                            <span className="px-3 py-1 bg-yt-hoverBg border border-yt-border rounded-full text-xs font-medium text-gray-300">
                                16 High-Precision SVGs
                            </span>
                            <span className="px-3 py-1 bg-red-950/60 border border-red-800/50 text-red-400 rounded-full text-xs font-semibold">
                                YouTube Spec
                            </span>
                        </div>
                    </header>

                    {/* Interactive YouTube Video Player Preview */}
                    <section className="mb-12">
                        <div className="flex items-center justify-between mb-3">
                            <h2 className="text-lg font-semibold text-white flex items-center gap-2">
                                <span className="w-2.5 h-2.5 rounded-full bg-red-500 animate-pulse"></span>
                                Interactive YouTube Media Player Preview
                            </h2>
                            <span className="text-xs text-gray-400">Thử nghiệm trực tiếp các nút bấm bên dưới</span>
                        </div>

                        <div className={`relative bg-black rounded-xl overflow-hidden shadow-2xl border border-yt-border transition-all duration-300 ${isTheater ? 'max-w-none' : 'max-w-4xl mx-auto'}`}>
                            {/* Video Display Area */}
                            <div className="relative aspect-video w-full bg-black flex items-center justify-center overflow-hidden">
                                <canvas ref={canvasRef} width="800" height="450" className="w-full h-full object-cover" />
                                
                                {/* On-screen action feedback (e.g. +10s, Play, Pause) */}
                                {actionFeedback && (
                                    <div className="absolute inset-0 flex items-center justify-center pointer-events-none">
                                        <div className="bg-black/80 text-white font-bold text-xl px-6 py-3 rounded-full border border-white/20 shadow-2xl backdrop-blur-md animate-bounce">
                                            {actionFeedback}
                                        </div>
                                    </div>
                                )}

                                {/* Subtitles Overlay */}
                                {subtitlesEnabled && isPlaying && (
                                    <div className="absolute bottom-16 left-1/2 transform -translate-x-1/2 pointer-events-none">
                                        <div className="bg-black/85 text-yellow-300 px-3 py-1 rounded text-sm sm:text-base font-medium border border-yellow-500/20 shadow-lg tracking-wide">
                                            ♪ [Âm nhạc sôi động - YouTube Player Control Demo] ♪
                                        </div>
                                    </div>
                                )}

                                {/* Center Big Play Button overlay if paused */}
                                {!isPlaying && (
                                    <button 
                                        onClick={() => setIsPlaying(true)}
                                        className="absolute p-5 rounded-full bg-black/60 text-white hover:bg-red-600 hover:scale-110 transition duration-200 backdrop-blur-sm border border-white/10 group"

                                    >
                                        <svg className="w-12 h-12 translate-x-0.5" viewBox="0 0 24 24" fill="currentColor">
                                            <path d="M8 5v14l11-7z"/>
                                        </svg>
                                    </button>
                                )}

                                {/* Settings Popover Menu */}
                                {showSettingsMenu && (
                                    <div className="absolute bottom-14 right-4 bg-yt-cardBg/95 backdrop-blur-md border border-yt-border rounded-lg shadow-2xl p-3 w-56 text-sm z-30 animate-in fade-in slide-in-from-bottom-2 duration-150">

                                                    key={fmt}
                                                    onClick={() => setCodeFormat(fmt)}
                                                    className={`px-2.5 py-1 text-xs rounded uppercase font-mono ${codeFormat === fmt ? 'bg-red-600 text-white font-bold' : 'bg-black text-gray-400 hover:text-white'}`}
                                                >
                                                    {fmt}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    {/* Code Box */}
                                    <div className="relative">
                                        <pre className="bg-black/90 text-gray-200 p-4 rounded-xl text-xs overflow-x-auto border border-yt-border leading-relaxed max-h-60">
                                            {generateCode(activeModalIcon, codeFormat, iconColor, iconSize)}
                                        </pre>
                                        <button
                                            onClick={() => copyToClipboard(generateCode(activeModalIcon, codeFormat, iconColor, iconSize), activeModalIcon.name)}
                                            className="absolute top-3 right-3 bg-red-600 hover:bg-red-500 text-white text-xs px-3 py-1.5 rounded-lg flex items-center gap-1 shadow"
                                        >
                                            <svg className="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg>
                                            Copy Code
                                        </button>
                                    </div>

                                    {/* Integration Guide */}
                                    <div className="bg-yt-darkBg p-3.5 rounded-xl border border-yt-border text-xs text-gray-400 space-y-1">
                                        <p className="font-semibold text-gray-300">💡 Mẹo tích hợp vào dự án:</p>
                                        <p>• Dùng <b>React JSX</b> trực tiếp trong dự án Next.js / Vite / CRA.</p>
                                        <p>• Dùng <b>SVG HTML</b> chèn thẳng vào file HTML tĩnh hoặc ứng dụng bất kỳ.</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Toast Notification */}
                    {toastMessage && (
                        <div className="fixed bottom-6 right-6 z-50 bg-red-600 text-white px-4 py-3 rounded-xl shadow-2xl flex items-center gap-3 border border-red-400 animate-in slide-in-from-bottom-5 duration-200">
                            <svg className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5">
                                <polyline points="20 6 9 17 4 12"/>
                            </svg>
                            <span className="text-xs font-semibold">{toastMessage}</span>
                        </div>
                    )}

                    {/* Footer */}
                    <footer className="mt-16 border-t border-yt-border pt-6 text-center text-xs text-gray-400">
                        <p>YouTube Media Player Controls Icon Set & Code Generator</p>
                        <p className="mt-1">Thiết kế chuẩn vector YouTube specs • Tương thích với React, Vue, HTML5 & Tailwind CSS</p>
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
